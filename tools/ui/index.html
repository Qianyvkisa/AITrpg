<!DOCTYPE html>
<html lang="zh-CN" data-theme="tentacle" data-read-width="normal">
<head>
  <meta charset="UTF-8">
  <title>UI 布局验证</title>
  <!-- 顺序必须和 src/index.html 一致：素材变量 → 主题变量 → 结构样式。
       少 motif-art.css 的话 --art-* 全部未定义，母题层与噪点会渲染成空，
       预览页看着「干净」，实际应用里却是有纹理的——两边就不一致了。 -->
  <link rel="stylesheet" href="../../src/motif-art.css">
  <link rel="stylesheet" href="../../src/themes.css">
  <link rel="stylesheet" href="../../src/styles.css">
  <link rel="stylesheet" href="../../src/tentacle.css">
  <style>
    /* 底色交给 themes.css 的 --bg-deep，不要在这里写死 hex：
       写死的话换主题时预览页背景不跟着变，截图核对会得出错误结论。 */
    body { background: var(--bg-deep); }
    /* 预览页不加载字体文件，用系统衬线兜底，避免 404 干扰判断 */
    :root { --font-serif: "Songti SC", "SimSun", serif; }
  </style>
</head>
<body>
  <div id="modalRoot"></div>
  <script>
    // 预览页的错误陷阱：模块里任何一步抛错都会让整页空白，
    // 而空白页截图上完全看不出原因。这里把错误直接写进 DOM，
    // --dump-dom 就能抓到（开发预览专用，不影响应用本体）。
    (function () {
      const show = (msg) => {
        let pre = document.getElementById('previewError');
        if (!pre) {
          pre = document.createElement('pre');
          pre.id = 'previewError';
          pre.style.cssText = 'position:fixed;inset:0;z-index:9999;margin:0;padding:16px;'
            + 'background:#1a0d0d;color:#f88;font:12px/1.6 monospace;white-space:pre-wrap;overflow:auto';
          document.body.appendChild(pre);
        }
        pre.textContent += msg + '\n';
      };
      window.addEventListener('error', (e) => {
        show('ERROR: ' + (e.message || e.type) + (e.filename ? ' @ ' + e.filename + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', (e) => {
        const r = e.reason;
        show('REJECT: ' + (r && (r.stack || r.message) || String(r)));
      });
    })();
  </script>
  <script type="module" src="./preview.js"></script>
</body>
</html>
