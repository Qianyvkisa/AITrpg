<!DOCTYPE html>
<html lang="zh-CN" data-theme="tentacle" data-read-width="normal">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
  <title>COC 跑团 · AI 守密人</title>
  <!-- 资源变量 → 调色板 → 通用布局 → 主题。 -->
  <link rel="stylesheet" href="motif-art.css">
  <link rel="stylesheet" href="themes.css">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="tentacle.css">
  <link rel="stylesheet" href="ritual.css">
  <link rel="stylesheet" href="investigator.css">
</head>
<body>

<!-- =========================================================================
     主界面（程序开始界面）：开始 / 继续 / 存档 / 模组管理 / 设置
     ========================================================================= -->
<div id="startScreen" class="start-screen">
  <!-- 像素写实备份主题的装饰层。 -->
  <div class="start-atmo" aria-hidden="true">
    <div class="atmo-motif"></div>
    <div class="atmo-ring"></div>
    <div class="atmo-ring atmo-ring-2"></div>
    <div class="atmo-vignette"></div>
    <span class="atmo-rune ar-1">✦</span>
    <span class="atmo-rune ar-2">✧</span>
    <span class="atmo-rune ar-3">❖</span>
    <span class="atmo-rune ar-4">✶</span>
    <span class="atmo-rune ar-5">✵</span>
  </div>

  <div class="start-inner">
    <div class="start-brand">
      <!-- sigil 的形状由主题决定（菱形/圆/方/六边形），
           内部符号由 --sigil-glyph 提供（◈ / ≈ / ▮ / ✶），
           所以这里只留空壳，具体字符全交给 themes.css -->
      <span class="start-sigil" aria-hidden="true"><i class="sigil-shape"></i><i class="sigil-glyph"></i></span>
      <h1>克苏鲁的呼唤</h1>
      <span class="start-rule"></span>
      <p class="start-sub">CALL OF CTHULHU · AI 守密人</p>
    </div>

    <nav class="start-menu" aria-label="主菜单">
      <!-- 进度信息条：有存档时显示这一局是谁、在哪个模组、跑到第几轮。
           放在按钮上方而不是塞进「继续」的描述里——后者只有一行、
           超出就被 ellipsis 截掉，玩家反而看不到关键信息。 -->
      <div class="start-progress" id="startProgress" hidden>
        <span class="sp-dot"></span>
        <div class="sp-body">
          <div class="sp-line" id="spTitle"></div>
          <div class="sp-line sp-dim" id="spMeta"></div>
        </div>
      </div>

      <!-- 进行中显示「继续」，结团后可回顾或开始新调查。 -->
      <button class="menu-btn primary" id="menuStart">
        <span class="mb-mark" aria-hidden="true"></span>
        <span class="mb-label">开始</span>
        <span class="mb-desc">开启一段新的调查</span>
        <span class="mb-arrow" aria-hidden="true">→</span>
      </button>

      <button class="menu-btn primary" id="menuContinue" hidden>
        <span class="mb-mark" aria-hidden="true"></span>
        <span class="mb-label">继续</span>
        <span class="mb-desc" id="menuContinueDesc"></span>
        <span class="mb-arrow" aria-hidden="true">→</span>
      </button>

      <!-- 联机：与「单机开一局」并列的另一种进入方式，不是附属功能，
           所以单独占一行卡片，而不是混在下面那排小按钮里 -->
      <button class="menu-btn online" id="menuOnline" data-art="wave">
        <span class="mb-mark" aria-hidden="true"></span>
        <span class="mb-label">联机</span>
        <span class="mb-desc">开房当守密人，或加入朋友的房间</span>
        <span class="mb-arrow" aria-hidden="true">→</span>
      </button>

      <!-- 放弃游戏：仅在存在进度时出现，清掉进度后回到「开始」状态 -->
      <button class="menu-btn danger" id="menuAbandon" data-art="skull" hidden>
        <span class="mb-mark" aria-hidden="true"></span>
        <span class="mb-label">放弃游戏</span>
        <span class="mb-desc">清除当前进度，重新开始</span>
        <span class="mb-arrow" aria-hidden="true">→</span>
      </button>

      <div class="menu-divider"><span class="md-gem" aria-hidden="true">◆</span></div>

      <div class="menu-mini-row">
        <button class="menu-mini" id="menuChars" data-art="person">角色卡</button>
        <button class="menu-mini" id="menuSaves" data-art="save">存档</button>
        <button class="menu-mini" id="menuModules" data-art="search">模组管理</button>
        <button class="menu-mini" id="menuRuleBook" data-art="book">规则书</button>
        <button class="menu-mini" id="menuSettings" data-art="gear">设置</button>
      </div>
    </nav>

    <div class="start-foot">
      <span id="startModel" class="start-model">未配置模型</span>
      <span class="start-sep">·</span>
      <span class="start-note">COC 7th · 进度自动保存到本地</span>
    </div>
  </div>
</div>

<!-- =========================================================================
     跑团界面
     ========================================================================= -->
<div id="app" hidden>

  <header class="topbar">
    <div class="brand">
      <span class="sigil" aria-hidden="true"></span>
      <span class="title">克苏鲁的呼唤</span>
      <span class="subtitle">AI 守密人</span>
    </div>
    <div class="top-actions">
      <span id="connStatus" class="conn-status" role="status">未配置</span>
      <!-- 侧栏折叠：宽屏下想专心读叙事时把两栏收起来。
           放在品牌右侧、功能按钮左侧，和「操作」区分开 -->
      <button class="btn ghost top-toggle" id="btnToggleLeft" title="折叠 / 展开左侧栏（Ctrl+[）" aria-label="调查员与队友" aria-controls="partySidebar" aria-expanded="true"></button>
      <button class="btn ghost top-toggle" id="btnToggleRight" title="折叠 / 展开右侧栏（Ctrl+]）" aria-label="状态、线索与日志" aria-controls="caseSidebar" aria-expanded="true"></button>
      <span class="top-sep"></span>
      <button class="btn ghost" id="btnBackToMenu" title="回到主界面">‹ 主界面</button>
      <button class="btn ghost" id="btnOnline" title="联机：开房或加入">联机</button>
      <button class="btn ghost" id="btnModules">模组</button>
      <button class="btn ghost" id="btnSaves">存档</button>
      <button class="btn ghost" id="btnSettings">设置</button>
    </div>
  </header>

  <main class="layout">

    <aside class="panel left-panel" id="partySidebar" aria-label="调查员与队友">
      <div class="panel-head">
        <h2 data-art="person">调查员</h2>
        <button class="icon-btn" id="btnNewChar" title="新建调查员">+</button>
      </div>
      <div id="charList" class="char-list"></div>

      <div class="panel-head" style="margin-top:18px">
        <h2 data-art="lamp">队友</h2>
        <button class="icon-btn" id="btnAddTeammate" title="添加 AI 队友">+</button>
      </div>
      <div id="teammateList" class="teammate-list"></div>
    </aside>

    <section class="panel center-panel" aria-label="跑团记录">
      <div class="scene-bar">
        <span class="scene-label" data-art="lamp">场景</span>
        <span id="sceneName" class="scene-name">尚未开始</span>
        <span id="turnCounter" class="turn-counter"></span>
        <span id="tokenMeter" class="token-meter" hidden
              title="本次会话累计消耗的 token（来自模型每次响应自报的用量）">
          <span class="token-icon">◈</span>
          <span id="tokenText">0</span>
        </span>
      </div>

      <div id="messages" class="messages"></div>

      <!-- 长局只渲染最近若干条；往前翻时点这个加载更早的记录 -->
      <button id="btnEarlier" class="earlier-btn" hidden>↑ 更早的记录</button>

      <!-- 上翻看历史时出现：提示「有新的内容」并一键回到底部 -->
      <button id="btnScrollBottom" class="scroll-bottom-btn" hidden
              title="回到最新内容">↓ 最新</button>

      <div class="composer">
        <textarea id="input" aria-label="调查行动" aria-describedby="composerHint" placeholder="你要做什么？（Enter 发送，Shift+Enter 换行）" rows="2"></textarea>
        <div class="composer-actions">
          <span id="composerHint" class="composer-hint"><kbd>Enter</kbd> 发送　<kbd>Shift + Enter</kbd> 换行</span>
          <span id="narrationStatus" class="narration-status" hidden><span id="narrationPhase" role="status"></span><span id="narrationElapsed" aria-hidden="true"></span></span>
          <button class="btn ghost" id="btnStopNarration" hidden>停止等待</button>
          <button class="btn ghost" id="btnAutoAdvance" hidden
                  title="开启后，每轮 KP 叙述完自动继续推进，不需要手动点「推进」">自动推进</button>
          <button class="btn ghost" id="btnExport" title="导出本次跑团记录为 txt（含对话、行动、投点）">导出记录</button>
          <button class="btn" id="btnSend">行动</button>
        </div>
      </div>
    </section>

    <aside class="panel right-panel" id="caseSidebar" aria-label="状态、线索与日志">
      <div class="panel-head"><h2 data-art="eye">状态</h2></div>
      <div id="statusPane" class="status-pane"></div>

      <div class="panel-head" style="margin-top:18px"><h2 data-art="search">线索</h2></div>
      <div id="clueList" class="clue-list"></div>

      <div class="panel-head" style="margin-top:18px"><h2 data-art="die">日志</h2></div>
      <div id="rollLog" class="roll-log"></div>
    </aside>
  </main>
</div>

<div id="modalRoot"></div>
<script type="module" src="app.js"></script>
</body>
</html>
