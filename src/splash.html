<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'">
<title>正在唤醒守密人</title>
<style>
  /* 这个窗口只有一个任务：在真正的界面准备好之前，别让用户对着空气。
     所以它必须极轻——单文件、零依赖、零脚本，任何加载失败都不该拖慢启动。 */
  :root {
    --bg: #0a0b0f;
    --ink: #d7d3c8;
    --dim: #6d7280;
    --accent: #b8894a;
    --accent-soft: #d9a962;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    display: grid;
    place-items: center;
    background: var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    overflow: hidden;
    /* 窗口本身是透明的圆角，靠这里的边线收边 */
    border: 1px solid #23262f;
    border-radius: 6px;
    user-select: none;
  }

  /* 背景微光：让纯黑不至于死板，缓慢呼吸 */
  .glow {
    position: fixed;
    inset: -40%;
    background: radial-gradient(ellipse at 50% 45%, rgba(184,137,74,.13), transparent 58%);
    animation: breathe 4.2s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes breathe {
    0%, 100% { opacity: .55; transform: scale(1); }
    50%      { opacity: 1;   transform: scale(1.06); }
  }

  .box {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
    padding: 0 34px;
  }

  /* 印记：旋转的菱形环，替代"转圈圈"这种通用加载图标 */
  .sigil {
    position: relative;
    width: 56px;
    height: 56px;
    margin-bottom: 22px;
  }
  .sigil span {
    position: absolute;
    inset: 0;
    border: 1px solid var(--accent);
    border-radius: 2px;
    opacity: .18;
  }
  .sigil span:nth-child(1) { transform: rotate(0deg);   animation: spin 7s   linear infinite; }
  .sigil span:nth-child(2) { transform: rotate(45deg);  animation: spin 9s   linear infinite reverse; opacity: .3; }
  .sigil span:nth-child(3) { transform: rotate(22.5deg);animation: spin 11s  linear infinite; opacity: .12; }
  @keyframes spin {
    from { transform: rotate(0deg); }
    to   { transform: rotate(360deg); }
  }
  /* 中心缓慢明灭的核心 */
  .sigil::after {
    content: "◈";
    position: absolute;
    inset: 0;
    display: grid;
    place-items: center;
    font-size: 20px;
    color: var(--accent-soft);
    animation: pulse 2.4s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: .35; }
    50%      { opacity: 1; }
  }

  h1 {
    font-family: "Songti SC", "SimSun", serif;
    font-size: 21px;
    font-weight: normal;
    letter-spacing: 9px;
    text-indent: 9px;
    color: #ded8ca;
    animation: rise .7s ease-out both;
  }
  .rule {
    width: 210px;
    height: 1px;
    margin: 13px 0 11px;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
    opacity: .5;
    animation: grow .9s ease-out .15s both;
  }
  @keyframes grow {
    from { transform: scaleX(.15); opacity: 0; }
    to   { transform: scaleX(1);   opacity: .5; }
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(6px); letter-spacing: 3px; }
    to   { opacity: 1; transform: translateY(0);   letter-spacing: 9px; }
  }

  .sub {
    font-size: 9.5px;
    letter-spacing: 4.5px;
    color: var(--dim);
    font-family: Consolas, monospace;
    animation: rise .7s ease-out .2s both;
  }

  /* 进度条：宽度不确定（我们并不知道还要多久），所以用流动光带表示"在动" */
  .bar {
    width: 210px;
    height: 2px;
    margin-top: 30px;
    background: #171a21;
    overflow: hidden;
    position: relative;
  }
  .bar::after {
    content: "";
    position: absolute;
    inset: 0;
    width: 45%;
    background: linear-gradient(90deg, transparent, var(--accent-soft), transparent);
    animation: slide 1.5s ease-in-out infinite;
  }
  @keyframes slide {
    0%   { transform: translateX(-110%); }
    100% { transform: translateX(330%); }
  }

  .hint {
    margin-top: 14px;
    font-size: 9px;
    letter-spacing: 2px;
    color: #454a56;
    animation: fade 1.2s ease-in .5s both;
  }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="glow"></div>
  <div class="box">
    <div class="sigil"><span></span><span></span><span></span></div>
    <h1>克苏鲁的呼唤</h1>
    <div class="rule"></div>
    <p class="sub">CALL OF CTHULHU</p>
    <div class="bar"></div>
    <p class="hint">正在唤醒守密人…</p>
  </div>
</body>
</html>
